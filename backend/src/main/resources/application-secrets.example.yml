# Copy this file to application-secrets.yml (same folder) and fill in your values.
# application-secrets.yml is git-ignored.
spring:
  datasource:
    password: "your-mysql-password"

homeplate:
  otp:
    # Testing only - numbers that accept test-code without SMS. Leave empty in production.
    test-numbers: ""
    test-code: "123456"
  jwt:
    secret: "base64-encoded-secret-at-least-32-bytes"
  twilio:
    enabled: true
    account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    api-key-sid: "SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    api-key-secret: "your-api-key-secret"
    verify-service-sid: "VAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    from-number: ""
  mail:
    from: "you@yourdomain.com"
    # Option A: Twilio SendGrid
    sendgrid-api-key: ""

