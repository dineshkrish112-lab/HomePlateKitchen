server:
  port: ${SERVER_PORT:8090}

spring:
  config:
    # Local secrets (DB password, Twilio keys) live in application-secrets.yml, which is git-ignored.
    import: "optional:classpath:application-secrets.yml"
  application:
    name: homeplate
  datasource:
    url: jdbc:mysql://localhost:3306/homeplate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

homeplate:
  jwt:
    secret: ${JWT_SECRET:aG9tZXBsYXRlLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tMjAyNg==}
    expiration-hours: 72
  upload-dir: ${UPLOAD_DIR:uploads}
  timezone: Asia/Kolkata
  # Only used when NO provider is configured for a channel: the OTP is then shown on screen.
  # Keep false in production so registration always needs a real SMS / email.
  dev-otp: ${DEV_OTP:false}
  otp:
    # Test numbers: register as customer or kitchen partner with OTP test-code, no SMS sent.
    # Ranges ("a-b") and lists ("a,b,c") both work.
    # PRODUCTION: set OTP_TEST_NUMBERS to an empty value so only real SMS OTP is accepted.
    test-numbers: ${OTP_TEST_NUMBERS:9000000002-9000000999}
    test-code: ${OTP_TEST_CODE:123456}
  # Fills the database with sample kitchens, customers and orders (demo only). Production: false.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    # API key (recommended) - create in Twilio Console > Account > API keys & tokens
    api-key-sid: ${TWILIO_API_KEY_SID:}
    api-key-secret: ${TWILIO_API_KEY_SECRET:}
    # Alternative to the API key
    auth-token: ${TWILIO_AUTH_TOKEN:}
    # Twilio Verify service used for SMS OTP (VA...)
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    # Optional: number for order notification SMS (not needed for OTP)
    from-number: ${TWILIO_FROM_NUMBER:}
  mail:
    # Email OTP + notifications. Either Twilio SendGrid (api key) or SMTP (spring.mail.*).
    from: ${MAIL_FROM:}
    from-name: HomePlate
    sendgrid-api-key: ${SENDGRID_API_KEY:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:9003,http://127.0.0.1:9003}

logging:
  level:
    com.homeplate: INFO
